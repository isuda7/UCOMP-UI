<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>GSAP ScrollTrigger 예제</title>
  <style>
		body {
		margin: 0;
		padding: 0;
		font-family: sans-serif;
		}

		.spacer {
		height: 100vh;
		background: #f0f0f0;
		display: flex;
		align-items: center;
		justify-content: center;
		font-size: 2rem;
		}

		.box {
		width: 100px;
		height: 100px;
		background-color: crimson;
		color: white;
		display: flex;
		align-items: center;
		justify-content: center;
		margin: 0 auto;
		}
  </style>
</head>
<body>

  <div class="spacer">스크롤 시작 공간</div>

  <div class="box">스크롤 트리거 대상</div>

  <div class="spacer">스크롤 종료 공간</div>

  <!-- GSAP + ScrollTrigger CDN -->
  <script src="https://unpkg.com/gsap@3/dist/gsap.min.js"></script>
  <script src="https://unpkg.com/gsap@3/dist/ScrollTrigger.min.js"></script>

  <script>
    gsap.registerPlugin(ScrollTrigger);

    gsap.to(".box", {
      x: 300,
      scrollTrigger: {
        trigger: ".box",
        start: "top 80%",
        end: "bottom top",
        scrub: true,
        pin: true,
		toggleActions: "play play reverse reverse",
		markers: true
      }
    });
  </script>

</body>
</html>
