<!DOCTYPE html>
<html lang="ko">

<head>
	<meta charset="UTF-8" />
	<title>turn.js 6페이지 책장 예제</title>
	<style>
		#magazine {
			width: 800px;
			height: 400px;
		}

		#magazine .page {
			background-color: #ccc;
		}

		#magazine div {
			text-align: center;
			font-size: 30px;
			line-height: 400px;
			overflow: hidden;
		}
.hard {
  background: #444;
  color: white;
  font-weight: bold;
}
	</style>
</head>

<body>

	<div id="magazine">
		<div class="page hard">표지 앞</div>
		<div class="page"><img src="../../assets/images/demo/visual-sub-01-pc.jpg" alt="" /></div>
		<div class="page"><img src="../../assets/images/demo/visual-sub-01-pc.jpg" alt="" /></div>
		<div class="page"><img src="../../assets/images/demo/visual-sub-01-pc.jpg" alt="" /></div>
		<div class="page"><img src="../../assets/images/demo/visual-sub-01-pc.jpg" alt="" /></div>
		<div class="page"><img src="../../assets/images/demo/visual-sub-01-pc.jpg" alt="" /></div>
		<div class="page"><img src="../../assets/images/demo/visual-sub-01-pc.jpg" alt="" /></div>
		<div class="page"><img src="../../assets/images/demo/visual-sub-01-pc.jpg" alt="" /></div>
		<div class="page"><img src="../../assets/images/demo/visual-sub-01-pc.jpg" alt="" /></div>
		<div class="page hard">표지 뒤</div>
	</div>
	<script src="../../assets/js/libs/jquery.min.js"></script>
	<!-- <script src="../../assets/js/libs/turn.js"></script> -->
	<script src="https://www.turnjs.com/lib/turn.min.js"></script>
	<script>
		$('#magazine').turn({
			 display: 'double',
			width: 800,
			height: 400,
			// autoCenter: true,
			gradients: true,    // 이게 꺼져있으면 elevation도 무효
			elevation: 100,      // 0 ~ 100, 클수록 접힘 높이 강조
		});
	</script>

</body>

</html>
