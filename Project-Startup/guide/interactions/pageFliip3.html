<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>책장 넘기기 - 연속 페이지 방식</title>
  <style>
    body {
      margin: 0;
      background: #222;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      user-select: none;
      font-family: "Noto Sans KR", sans-serif;
    }

    .book {
      position: relative;
      width: 600px;
      height: 400px;
      perspective: 2000px;
      cursor: pointer;
    }

    .page {
      position: absolute;
      width: 100%;
      height: 100%;
      background: linear-gradient(120deg, #fff 0%, #f7f7f7 50%, #e1e1e1 100%);
      box-shadow: inset -5px 0 15px rgba(0, 0, 0, 0.1);
      transform-style: preserve-3d;
      transform-origin: left;
      transition: transform 1s ease, box-shadow 1s ease, background 1s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 30px;
      font-weight: bold;
      color: #333;
      backface-visibility: hidden;
      user-select: none;
      border-left: 1px solid #ccc;
      border-right: 1px solid #ccc;
      box-sizing: border-box;
      z-index: 0;
    }

    /* 뒤집힌 페이지 스타일 */
    .page.flipped {
      transform: rotateY(-180deg);
      background: linear-gradient(120deg, #f0f0f0 0%, #dcdcdc 50%, #c0c0c0 100%);
      box-shadow: inset 10px 0 20px rgba(0, 0, 0, 0.2);
      z-index: 10;
    }
  </style>
</head>
<body>

  <div class="book" id="book">
    <div class="page" data-index="0">페이지 1</div>
    <div class="page" data-index="1">페이지 2</div>
    <div class="page" data-index="2">페이지 3</div>
    <div class="page" data-index="3">페이지 4</div>
    <div class="page" data-index="4">페이지 5</div>
    <div class="page" data-index="5">페이지 6</div>
  </div>

  <script>
    const pages = [...document.querySelectorAll('.page')];
    let currentPage = 0; // 현재 책 넘긴 페이지 수 (0이면 처음 상태)

    // 페이지 상태 업데이트 함수
    function updatePages() {
      pages.forEach((page, i) => {
        if (i < currentPage) {
          page.classList.add('flipped');  // 넘긴 페이지 뒤집기
          page.style.zIndex = i + 1;       // 넘긴 페이지는 뒤로 보내기
        } else {
          page.classList.remove('flipped'); // 앞으로 넘길 페이지는 원상태
          page.style.zIndex = pages.length - i; // 앞으로 보일 페이지는 위로 올리기
        }
      });
    }

    updatePages();

    // 책 영역 클릭 이벤트 (오른쪽 클릭시 넘기기, 왼쪽 클릭시 뒤로 넘기기)
    document.getElementById('book').addEventListener('click', (e) => {
      const isRight = e.clientX > window.innerWidth / 2;

      if (isRight && currentPage < pages.length) {
        currentPage++;
        updatePages();
      } else if (!isRight && currentPage > 0) {
        currentPage--;
        updatePages();
      }
    });
  </script>

</body>
</html>
