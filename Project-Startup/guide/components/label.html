<!doctype html>
<html lang="ko">

<head>
	<meta charset="utf-8" />
	<title>Prototype | 프로젝트 스타일가이드</title>
	<meta http-equiv="X-UA-Compatible" content="IE=edge" />
	<meta name="viewport" content="width=device-width,initial-scale=1.0" />
	<meta name="keywords" content="프로젝트가이드, 프로젝트 스타일가이드" />
	<meta name="description" content="프로젝트가이드, 프로젝트 스타일가이드" />
	<link rel="shortcut icon" href="../../favicon.ico" type="image/x-icon" />
	<link rel="stylesheet" type="text/css" href="../../assets/css/ui.style.css" />

	<script src="../../assets/js/libs/jquery.min.js"></script>
	<script src="../../assets/js/libs/librurys.min.js"></script>
	<script src="../../assets/js/ui/ui.common.js"></script>
	<link rel="stylesheet" type="text/css" href="css/guide.css" /><!-- 가이드전용 -->
	<!-- 페이지 스크립트 영역 -->
</head>

<body>
	<div class="wrapper">
		<!-- Container -->
		<main class="g-container">
			<div id="content" class="content">
				<div class="content-body outer">
					<div class="inner">
						<h1 class="g-h1">Label</h1>
					</div>
					<!-- Section -->
					<section class="g-section inner">
						<div class="g-section-header">
							<h2 class="g-h2">System</h2>
						</div>
						<div class="g-section-body">
							<h3 class="g-h3">규칙</h3>
							<div class="g-tbl-type1">
								<table>
									<colgroup>
										<col style="width:20%">
										<col>
									</colgroup>
									<tbody>
										<tr>
											<th class="align-l">기본</th>
											<td class="align-l"><code class="g-code-label">label</code></td>
										</tr>
										<tr>
											<th class="align-l">모듈</th>
											<td class="align-l"><code class="g-code-label">module-*</code></td>
										</tr>
										<tr>
											<th class="align-l">옵션</th>
											<td class="align-l"><code class="g-code-label">[강조]</code>, <code class="g-code-label">[라인]</code></td>
										</tr>
									</tbody>
								</table>
							</div>
							<h3 class="g-h3">기본</h3>
							<xmp>
<span class="label module-* type-*"></span>
							</xmp>
							<h3 class="g-h3">옵션</h3>
							<h4 class="g-h4">강조</h4>
							<span class="label module-c">Default</span>
							<span class="label module-c primary">Primary</span>
							<span class="label module-c secondary">Secondary</span>
							<h4 class="g-h4">라인</h4>
							<span class="label module-c outlined">Default</span>
							<span class="label module-c outlined primary">Primary</span>
							<span class="label module-c outlined secondary">Secondary</span>
						</div>
					</section>
					<!-- // Section -->

					<!-- Section -->
					<section class="g-section inner">
						<div class="g-section-header">
							<h2 class="g-h2">Modules</h2>
						</div>
						<div class="g-section-body">
							<h3 class="g-h3">label</h3>
							<h4 class="g-h4">module-a</h4>
							<span class="label module-a type-skt">SKT</span>
							<span class="label module-a type-kt">KT</span>
							<span class="label module-a type-lgt">LGU</span>
							<span class="label module-a type-low-lgt">알뜰폰</span>

							<h4 class="g-h4">module-b</h4>
							<span class="label module-b type-recom">추천</span>
							<span class="label module-b type-best">베스트</span>

							<h4 class="g-h4">module-c</h4>
							<span class="label module-c">Default</span>
							<span class="label module-c primary">Primary</span>
							<span class="label module-c secondary">Secondary</span>
						</div>
					</section>
					<!-- // Section -->
				</div>
			</div>
		</main>
		<!-- // Container -->

		<!-- Footer -->
		<footer class="footer"></footer>
		<!-- // Footer -->
	</div>
</body>

</html>
